name: waihona
title: Waihona
version: 0.1.0
artifact_class: 2
summary: Scaffolds and maintains a context-base — indexed external memory a small model traverses within budget.

tier:
  minimum: 1

context_budget:
  instructions_max_tokens: 1200   # router + largest op file (find.md), measured conservatively
  session_max_tokens: 9000        # worst-case traversal (~7.5k) + instructions + task margin

permissions:
  filesystem:
    read: ["~/.kamaaina/context-base/", "./context-base/"]
    write: ["~/.kamaaina/context-base/", "./context-base/"]
  network: none
  exec: ["python3 scripts/cb.py"]

dependencies:
  tools: []
  binaries: ["python3"]
  model:
    min_params: "7B"
    capabilities: []

state_files:
  - path: "<base-root>/INDEX.md"
    purpose: "Per-directory index; one line per entry; regenerated by scripts/cb.py reindex"
    lifecycle: persistent
  - path: "<base-root>/**/*.md"
    purpose: "Leaves — one coherent topic each, <=1000 tokens, frontmatter summary+updated"
    lifecycle: persistent
  - path: "<base-root>/_inbox.md"
    purpose: "Write-path staging; appended during sessions, emptied by the filing pass; never read as authority"
    lifecycle: persistent

not_ai:
  - step: "Create a new base (root INDEX.md, _inbox.md)"
    implementation: "scripts/cb.py init <root>"
  - step: "Rebuild every INDEX.md from leaf frontmatter and branch purpose lines"
    implementation: "scripts/cb.py reindex <root>"
  - step: "Enforce sizing rules (leaf/index token caps, entry caps, line length) and detect index drift"
    implementation: "scripts/cb.py check <root>"
  - step: "Generate the deterministic Tier 1 validation fixture"
    implementation: "scripts/cb.py fixture <root>"
  # The entry below is a development/certification-time harness, not a
  # use-time operation: it contacts a local inference endpoint to test a
  # model against the traversal protocol, so it sits outside the use-time
  # permission envelope declared above (network: none still holds for use).
  - step: "Drive and score the Tier 1 traversal validation run"
    implementation: "scripts/validate_traversal.py (dev/certification-time; local inference endpoint only)"
